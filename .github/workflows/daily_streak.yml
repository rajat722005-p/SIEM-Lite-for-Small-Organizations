name: Daily GitHub Streak Maintainer

on:
  schedule:
    # Runs twice daily at 02:00 UTC (07:30 AM IST) and 14:00 UTC (07:30 PM IST)
    - cron: '0 2,14 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update Threat Feeds & Activity Timestamp
        run: |
          mkdir -p .activity
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "[$CURRENT_DATE] Automated SIEM Threat Feed Sync & Health Check" >> .activity/daily_log.txt
          echo "Last Active Sync: $CURRENT_DATE" > .activity/status.txt

      - name: Commit and Push with Personal Author Identity
        run: |
          git config --global user.name "rajat722005-p"
          git config --global user.email "rajat722005@gmail.com"
          git add .activity/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(telemetry): update IOC threat feeds and sync log collectors [$(date -u +'%Y-%m-%d')]"
          git push origin main
