name: Daily Natural Developer Activity & Streak Maintainer

on:
  schedule:
    # Runs at natural developer hours (03:30, 09:30, 15:30, 21:30 UTC)
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  developer-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIEM-Lite Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 10

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Organic Developer Commit Generator
        run: |
          python .github/scripts/random_dev_commit.py
