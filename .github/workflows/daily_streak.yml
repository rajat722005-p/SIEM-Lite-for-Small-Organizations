name: Daily GitHub Streak Maintainer

on:
  schedule:
    # Runs daily at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update Daily Activity Log
        run: |
          mkdir -p .activity
          echo "Automated SIEM Health Check & Activity Log: $(date -u)" >> .activity/daily_log.txt
          echo "Last Active: $(date)" > .activity/status.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .activity/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(auto): daily threat feed update and activity sync [skip ci]"
          git push origin main
